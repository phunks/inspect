name: Release
permissions:
  contents: write

on:
  workflow_dispatch:
    tags:
      - v*
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ${{ matrix.job.os }}
    strategy:
      fail-fast: false
      matrix:
        job:
          - { os: ubuntu-latest  , target: x86_64-unknown-linux-gnu        , extension: ""   }
          - { os: ubuntu-latest  , target: x86_64-unknown-linux-musl       , extension: ""   }
          - { os: ubuntu-latest  , target: armv7-unknown-linux-musleabihf  , extension: ""   }
          - { os: ubuntu-latest  , target: aarch64-unknown-linux-gnu       , extension: ""   }
          - { os: ubuntu-latest  , target: aarch64-unknown-linux-musl      , extension: ""   }
          - { os: macos-latest   , target: x86_64-apple-darwin             , extension: ""   }
          - { os: macos-latest   , target: aarch64-apple-darwin            , extension: ""   }
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract crate information
        shell: bash
        run: |
          echo "PROJECT_NAME=$(sed -n 's/^name = "\(.*\)"/\1/p' Cargo.toml | head -n1)" >> $GITHUB_ENV

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.job.target }}

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2

      - name: Install cargo-zigbuild
        uses: taiki-e/install-action@cargo-zigbuild

      - name: Build
        shell: bash
        env:
          RUSTFLAGS: -C strip=symbols
        run: |
          cargo zigbuild --release --target ${{ matrix.job.target }}

      - name: Rename artifacts
        shell: bash
        run: |
          mv target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}{,-${{ github.ref_name }}-${{ matrix.job.target }}${{ matrix.job.extension }}}

      - name: Release
        uses: softprops/action-gh-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            target/${{ matrix.job.target }}/release/${{ env.PROJECT_NAME }}-${{ github.ref_name }}-${{ matrix.job.target }}${{ matrix.job.extension }}