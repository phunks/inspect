[package]
name = "inspect"
version = "0.1.0"
edition = "2024"

[dependencies]
rama = { version = "0.3.0-alpha.4", features = ["http", "rustls", "http-full", "compression"]  }
bytes = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4"] }
anyhow = "1.0"
sqlx = { version = "0.9", features = ["sqlite", "json", "chrono", "_sqlite", "runtime-tokio"] }
http = "1.4"
http-body-util = "0.1"
tokio = { version = "1.52", features = ["full"] }
rustls = "0.23"
time = "0.3"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tracing-futures = "0.2"
chrono = "0.4"
#tuie = { path = "ext/tuie" }
tuie = "0.1.6"
chord_macro = "0.1"
parking_lot = "0.12"