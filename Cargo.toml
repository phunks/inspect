[package]
name = "inspect"
version = "0.7.0"
edition = "2024"

#[profile.release]
#debug = true
#strip = false
#split-debuginfo = "packed"

[profile.dev]
debug = true
strip = false
split-debuginfo = "packed"

[dependencies]
rama = { path = "ext/rama", version = "0.3", features = ["http", "boring", "http-full", "ua", "compression", "aws-lc", "ring"]  }
bytes = "1.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.23", features = ["v4"] }
anyhow = "1.0"
sqlx = { version = "0.9", features = ["sqlite", "json", "chrono", "_sqlite", "runtime-tokio"] }
tokio = { version = "1.52", features = ["full"] }
time = "0.3"
clap = { version = "4.6", features = ["derive"] }
flate2 = "1.1"
base64 = "0.22"
brotli = "8.0"
zstd = "0.13"
tracing = "0.1"
tracing-subscriber = "0.3"
tracing-appender = "0.2"
tracing-futures = "0.2"
tree-sitter = "0.26"
tree-sitter-javascript = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
chrono = "0.4"
console = "0.16"
tuie = { path = "ext/tuie" }
chord_macro = "0.1"
parking_lot = "0.12"
regex = "1.12"
grep-regex = "0.1"
grep-searcher = "0.1"
ignore = "0.4"
toml = "1.1"
roto = { git = "https://codeberg.org/NLnetLabs/roto", features = ["selinux-fix"] }
json-patch = "4.2"
terminal-colorsaurus = "1"

[patch.crates-io]
rama-tls-boring = { path = "ext/rama/rama-tls-boring" }


